name: CI

on:
  push:
    branches: [main, "setup/**", "feat/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: make lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: make test-unit
      - name: GDB extension smoke
        run: pytest -q tests/integration/test_ocl_break_records.py --run-integration

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dev image
        run: docker build -t oclens-dev .
      - name: Integration smoke (doctor + skipped integration tests)
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            oclens-dev \
            bash -lc 'python3 -m venv .venv && . .venv/bin/activate && pip install -e ".[dev]" && cmake -S . -B build -G Ninja && cmake --build build && source ./scripts/env.sh && oclens verify --full'

